<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1c1f">
<title>Finsen Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-row">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜尋筆記…">
      </div>
      <button class="icon-btn" id="settingsBtn" title="設定 / 備份">⋮</button>
    </div>
    <div class="chips" id="folderChips"></div>
    <div class="sort-row">
      <select id="sortSelect">
        <option value="updated">最近修改</option>
        <option value="due">到期日優先</option>
        <option value="title">標題 A-Z</option>
      </select>
    </div>
  </header>

  <main>
    <div class="empty-state" id="emptyState" style="display:none">
      未有筆記，撳右下角「+」開始寫第一則。
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <button class="fab" id="fabAdd" title="新增筆記">+</button>

  <!-- Note editor -->
  <div class="overlay" id="editorOverlay">
    <div class="sheet">
      <div class="sheet-header">
        <button class="icon-btn" id="closeEditorBtn">←</button>
        <div style="display:flex; gap:8px;">
          <button class="icon-btn" id="pinBtn" title="釘選">📌</button>
          <button class="icon-btn" id="deleteBtn" title="刪除">🗑</button>
        </div>
      </div>

      <input class="title-input" id="titleInput" type="text" placeholder="標題">

      <div class="type-toggle">
        <button id="typeTextBtn" data-type="text">純文字</button>
        <button id="typeChecklistBtn" data-type="checklist">Checklist</button>
      </div>

      <div class="field" id="textFieldWrap">
        <textarea id="contentInput" placeholder="內容…"></textarea>
      </div>

      <div id="checklistWrap" style="display:none">
        <div class="checklist-items" id="checklistItems"></div>
        <button class="add-item-btn" id="addItemBtn">+ 新增項目</button>
      </div>

      <div class="field">
        <label>顏色</label>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="row-2 field">
        <div>
          <label>資料夾</label>
          <select id="folderSelect"></select>
        </div>
        <div>
          <label>到期日 / 提醒</label>
          <div class="due-row">
            <input type="date" id="dueDateInput">
            <input type="time" id="dueTimeInput">
          </div>
        </div>
      </div>

      <div class="sheet-actions">
        <button class="btn danger" id="clearDueBtn">清除到期日</button>
      </div>
    </div>
  </div>

  <!-- Settings / backup -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <div class="sheet-header">
        <h3 style="margin:0">設定</h3>
        <button class="icon-btn" id="closeSettingsBtn">✕</button>
      </div>

      <div class="settings-section">
        <h4>提醒通知</h4>
        <p class="hint">開啟後，App 喺前台或背景短暫執行時，去到到期時間會嘗試發出通知。手機背景執行有限制（尤其 iOS），到期／逾期筆記一律會用顏色標記，唔靠通知都睇到。</p>
        <button class="btn" id="enableNotifBtn">啟用通知</button>
        <span id="notifStatus" style="margin-left:8px; font-size:12.5px; color:var(--text-dim)"></span>
      </div>

      <div class="settings-section">
        <h4>備份</h4>
        <p class="hint">匯出所有筆記同資料夾做一個 JSON 檔，可以存喺手機任何資料夾（例如 Downloads），或轉存去雲端硬碟自己保存。</p>
        <button class="btn primary" id="backupBtn">備份（匯出 JSON）</button>
      </div>

      <div class="settings-section">
        <h4>還原</h4>
        <p class="hint">選返之前備份嘅 JSON 檔，還原資料。新資料會同現有筆記合併（相同 ID 覆蓋）。</p>
        <input type="file" id="restoreFile" accept="application/json" style="display:none">
        <button class="btn" id="restoreBtn">還原（匯入 JSON）</button>
      </div>

      <div class="settings-section">
        <h4>資料夾管理</h4>
        <div class="chips" id="manageFolderChips"></div>
        <button class="btn" id="addFolderBtn" style="margin-top:8px;">+ 新增資料夾</button>
      </div>

      <div class="settings-section">
        <h4>危險區域</h4>
        <button class="btn danger" id="clearAllBtn">清除所有資料</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
