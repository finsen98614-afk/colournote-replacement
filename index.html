<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2efe6">
<title>Finsen Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-row">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜尋筆記…">
      </div>
      <button class="icon-btn" id="settingsBtn" title="設定 / 備份">⋮</button>
    </div>
    <div class="chips" id="folderChips"></div>
    <div class="sort-row">
      <select id="sortSelect">
        <option value="updated">最近修改</option>
        <option value="due">到期日優先</option>
        <option value="title">標題 A-Z</option>
      </select>
    </div>
  </header>

  <main>
    <div class="empty-state" id="emptyState" style="display:none">
      未有筆記，撳右下角「+」開始寫第一則。
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <button class="fab" id="fabAdd" title="新增筆記">+</button>

  <!-- Note editor: ColorNote-style full-screen ruled paper -->
  <div class="overlay full" id="editorOverlay">
    <div class="note-sheet c-default" id="editorSheet">

      <div class="note-bar">
        <button class="bar-btn" id="closeEditorBtn" title="儲存並返回">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/>
          </svg>
        </button>
        <input class="bar-title" id="titleInput" type="text" placeholder="標題">
        <button class="bar-swatch" id="colorBtn" title="顏色"></button>
        <button class="bar-btn" id="menuBtn" title="更多">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="5" r="2" fill="currentColor"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
            <circle cx="12" cy="19" r="2" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div class="note-meta">
        <span id="editingLabel">Editing</span>
        <span id="noteTimestamp"></span>
      </div>

      <div class="note-body">
        <div id="textFieldWrap" class="paper-wrap">
          <textarea id="contentInput" class="paper" placeholder="內容…" spellcheck="false"></textarea>
        </div>

        <div id="checklistWrap" class="paper-wrap" style="display:none">
          <div class="paper checklist-paper">
            <div class="checklist-items" id="checklistItems"></div>
            <button class="add-item-btn" id="addItemBtn">＋ 新增項目</button>
          </div>
        </div>
      </div>

      <!-- colour picker popover -->
      <div class="pop color-pop" id="colorPop">
        <div class="swatches" id="swatches"></div>
      </div>

      <!-- overflow menu popover -->
      <div class="pop menu-pop" id="menuPop">
        <div class="menu-section">
          <div class="menu-label">格式</div>
          <div class="type-toggle">
            <button id="typeTextBtn" data-type="text">純文字</button>
            <button id="typeChecklistBtn" data-type="checklist">Checklist</button>
          </div>
        </div>

        <button class="menu-item" id="pinBtn">
          <span>釘選喺最上</span><span class="menu-check" id="pinCheck">✓</span>
        </button>

        <div class="menu-section">
          <div class="menu-label">資料夾</div>
          <select id="folderSelect"></select>
        </div>

        <div class="menu-section">
          <div class="menu-label">到期日 / 提醒</div>
          <div class="due-row">
            <input type="date" id="dueDateInput">
            <input type="time" id="dueTimeInput">
          </div>
          <button class="menu-mini" id="clearDueBtn">清除到期日</button>
        </div>

        <button class="menu-item danger" id="deleteBtn">刪除呢則筆記</button>
      </div>

    </div>
  </div>

  <!-- Settings / backup -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <div class="sheet-header">
        <h3 style="margin:0">設定</h3>
        <button class="icon-btn" id="closeSettingsBtn">✕</button>
      </div>

      <div class="settings-section">
        <h4>提醒通知</h4>
        <p class="hint">App 開住嗰陣到期會出通知；閂咗之後再開會補發錯過嘅提醒。App 一直冇開就唔會響（網頁 App 嘅平台限制）。逾期／今日到期一律有顏色標記，唔靠通知都睇到。</p>
        <button class="btn" id="enableNotifBtn">啟用通知</button>
        <span id="notifStatus" style="margin-left:8px; font-size:12.5px; color:var(--text-dim)"></span>
      </div>

      <div class="settings-section">
        <h4>備份</h4>
        <p class="hint">匯出所有筆記同資料夾做一個 JSON 檔，可以存喺手機任何資料夾，或轉存去雲端硬碟自己保存。</p>
        <button class="btn primary" id="backupBtn">備份（匯出 JSON）</button>
      </div>

      <div class="settings-section">
        <h4>還原</h4>
        <p class="hint">選返之前備份嘅 JSON 檔，還原資料。新資料會同現有筆記合併（相同 ID 覆蓋）。</p>
        <input type="file" id="restoreFile" accept="application/json" style="display:none">
        <button class="btn" id="restoreBtn">還原（匯入 JSON）</button>
      </div>

      <div class="settings-section">
        <h4>資料夾管理</h4>
        <div class="chips" id="manageFolderChips"></div>
        <button class="btn" id="addFolderBtn" style="margin-top:8px;">＋ 新增資料夾</button>
      </div>

      <div class="settings-section">
        <h4>危險區域</h4>
        <button class="btn danger" id="clearAllBtn">清除所有資料</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
